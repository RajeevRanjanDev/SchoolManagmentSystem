# =============================================================
#  DEMO profile – runs with H2 in-memory database
#  No PostgreSQL, Redis, or Docker needed.
#
#  Start with:  mvn spring-boot:run -Dspring-boot.run.profiles=demo
# =============================================================

spring:

  # ── H2 in-memory database (replaces PostgreSQL for demo) ──
  datasource:
    url: jdbc:h2:mem:smsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # ── H2 web console (http://localhost:8080/h2-console) ──────
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  # ── JPA – let Hibernate create the schema (no Flyway in demo)
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

  # ── Disable Flyway (H2 uses Hibernate DDL instead) ─────────
  flyway:
    enabled: false

  # ── Disable Redis (no cache server needed for demo) ────────
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.cache.CacheAutoConfiguration

# ── JWT (short secrets fine for local demo) ─────────────────
jwt:
  secret: DemoSecretKeyForLocalTestingOnlyDoNotUseInProduction2024SMS
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000

logging:
  level:
    com.sms.school: INFO
    org.hibernate.SQL: DEBUG
