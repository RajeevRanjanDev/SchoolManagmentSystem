# =============================================================
#  PROD Profile — PostgreSQL (Cloud / Production)
#  Activate with:  --spring.profiles.active=prod
#
#  Required environment variables:
#    DB_HOST         PostgreSQL host        (e.g. db.example.com)
#    DB_PORT         PostgreSQL port        (default: 5432)
#    DB_NAME         Database name          (e.g. sms_db)
#    DB_USERNAME     DB user                (e.g. sms_user)
#    DB_PASSWORD     DB password
#    JWT_SECRET      Strong random secret   (min 64 chars)
#
#  Optional:
#    SERVER_PORT     (default: 8080)
#    REDIS_HOST      Redis host             (default: localhost)
#    REDIS_PORT      Redis port             (default: 6379)
#    REDIS_PASSWORD  Redis auth password    (default: empty)
# =============================================================

spring:

  # ── PostgreSQL DataSource (HikariCP) ─────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: SmsHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000       # 30 s
      idle-timeout: 600000            # 10 min
      max-lifetime: 1800000           # 30 min
      keepalive-time: 120000          # 2 min heartbeat
      connection-test-query: SELECT 1

  # ── JPA / Hibernate ──────────────────────────────────────
  #  Flyway owns DDL in production; Hibernate only validates.
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  # ── Flyway — ON for production ────────────────────────────
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public
    out-of-order: false
    validate-on-migrate: true

  # ── Redis Cache ────────────────────────────────────────────
  cache:
    type: simple    # change to 'redis' when Redis is provisioned
  # Uncomment below when Redis is available:
  # cache:
  #   type: redis
  # data:
  #   redis:
  #     host: ${REDIS_HOST:localhost}
  #     port: ${REDIS_PORT:6379}
  #     password: ${REDIS_PASSWORD:}
  #     timeout: 2000ms
  #     lettuce:
  #       pool:
  #         max-active: 10
  #         max-idle: 5

  # ── H2 Console — always OFF in production ─────────────────
  h2:
    console:
      enabled: false

# ── Production logging (INFO only, no SQL) ───────────────
logging:
  level:
    com.sms.school: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:./logs/sms-app.log}
    max-size: 50MB
    max-history: 30
