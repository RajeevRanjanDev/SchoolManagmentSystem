# Test profile – uses an H2 in-memory database so no Postgres is needed for unit tests
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false   # H2 handles DDL; Flyway scripts are PG-specific

jwt:
  secret: TestSecretKeyForUnitTestsThatIsLongEnoughToBeValid2024
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000
