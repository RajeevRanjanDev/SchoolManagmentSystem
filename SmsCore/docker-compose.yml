version: "3.9"

# ─────────────────────────────────────────────────────────────────────
#  docker-compose.yml – Local development stack
#
#  Services:
#   • postgres  – PostgreSQL 16 database
#   • redis     – Redis 7 cache
#   • app       – Spring Boot application
#
#  Quick start:
#    docker-compose up --build
#
#  Access points:
#    API:        http://localhost:8080
#    Swagger:    http://localhost:8080/swagger-ui.html
#    pgAdmin:    http://localhost:5050
# ─────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sms_db
      POSTGRES_USER: sms_user
      POSTGRES_PASSWORD: sms_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms_user -d sms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot App ───────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sms_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sms_db
      DB_USERNAME: sms_user
      DB_PASSWORD: sms_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8080
      JWT_SECRET: ThisIsAVerySecretKeyForSMSApplicationThatShouldBeChangedInProduction2024
      JWT_ACCESS_EXPIRY: 900000
      JWT_REFRESH_EXPIRY: 604800000
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

  # ── pgAdmin (optional GUI for Postgres) ──────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sms_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sms.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
  uploads:
