# =============================================================
#  School Management System - Application Configuration
# =============================================================

spring:
  application:
    name: school-management-system

  # ── PostgreSQL datasource ──────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sms_db}
    username: ${DB_USERNAME:sms_user}
    password: ${DB_PASSWORD:sms_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA / Hibernate ───────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns DDL, Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  # ── Flyway database migrations ────────────────────────────
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public

  # ── Redis cache ───────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  # ── Jackson JSON ──────────────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

# ── Server config ─────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

# ── JWT Configuration ─────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:ThisIsAVerySecretKeyForSMSApplicationThatShouldBeChangedInProduction2024}
  access-token-expiry-ms: ${JWT_ACCESS_EXPIRY:900000}        # 15 minutes
  refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY:604800000}   # 7 days

# ── Firebase Push Notification ────────────────────────────
firebase:
  credentials-path: ${FIREBASE_CREDENTIALS:classpath:firebase-service-account.json}

# ── File Upload (event photos etc.) ──────────────────────
file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}
  max-size: 10MB

# ── Springdoc / Swagger ───────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: false

# ── Actuator endpoints ────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# ── Logging ───────────────────────────────────────────────
logging:
  level:
    com.sms.school: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
